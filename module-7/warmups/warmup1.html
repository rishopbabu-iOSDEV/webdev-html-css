<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox</title>
  <style>
    .row {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .box {
      /* flex: 1 1 140px; */
      padding: 1rem;
      background: #dce8ff;
      border: 1px solid #155eef;
    }
  </style>
</head>
<body>
  <h1>Flexbox practice</h1>
  <div class="row">
    <div class="box">
1    </div>
    <div class="box">
2    </div>
    <div class="box">
3    </div>
    <div class="box">
4    </div>
    <div class="box">
5    </div>
  </div>
</body>
</html>

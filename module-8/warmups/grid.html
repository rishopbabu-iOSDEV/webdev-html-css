<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grid</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem
        }

        .box {
            padding: 2rem;
            background: #dce8ff
        }

        .box:first-child {
            grid-column: span 2
        }
    </style>
</head>

<body>
    <h1>Grid practice</h1>
    <div class="grid">
        <div class="box">1 spans two</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>

</html>

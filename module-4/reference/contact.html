<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <header>
        <h1>Ananya Rao</h1>
        <nav><a href="index.html">Home</a> <a href="about.html">About</a> <a href="projects.html">Projects</a> <a
                href="contact.html">Contact</a></nav>
    </header>
    <main>
        <h2>Contact</h2>
        <form>
            <fieldset>
                <legend>Your details</legend>
                <label for="name">Name</label>
                <input id="name" name="name" type="text"required>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </fieldset>
            <fieldset>
                <legend>Your message</legend><label for="reason">Reason</label><select id="reason" name="reason">
                    <option>Feedback</option>
                    <option>Project</option>
                    <option>Learning</option>
                </select><label for="message">Message</label><textarea id="message" name="message" minlength="20"
                    required></textarea><button type="submit">Send</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Ananya Rao</p>
    </footer>
</body>
